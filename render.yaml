services:
  - type: web
    name: mini-erp-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push && npx prisma db seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
